<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header A — Accent Stripe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #fff; --fg: #111; --accent: #0057ff; --highlight: #ccff00;
    --highlight-fg: #111; --muted: #595959; --rule: #eee;
  }
  [data-theme="dark"] {
    --bg: #141418; --fg: #e4e4e7; --accent: #3b82f6; --highlight: #ccff00;
    --highlight-fg: #141418; --muted: #8b8b96; --rule: #2a2a2e;
  }
  body { font-family: 'IBM Plex Mono', monospace; background: var(--bg); color: var(--fg); font-size: 16px; line-height: 1.6; }
  .site { max-width: 680px; margin: 0 auto; padding: 2rem 1.5rem; }
  .label { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted); margin-bottom: 1.5rem; }

  /* === HEADER A: Accent stripe above name === */
  .site-header { margin-bottom: 3rem; }

  .accent-stripe {
    height: 4px;
    background: var(--accent);
    margin-bottom: 1.5rem;
  }

  .name-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 0.75rem;
    margin-bottom: 0.5rem;
    border-bottom: 2px solid var(--fg);
  }

  .site-name {
    font-size: 1.5rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-decoration: none;
    color: var(--fg);
  }

  .theme-toggle {
    background: none;
    border: 1.5px solid var(--fg);
    width: 2rem;
    height: 2rem;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    align-self: center;
  }
  .theme-toggle::before {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: var(--fg);
  }
  [data-theme="dark"] .theme-toggle::before {
    background: none;
    border: 2px solid var(--fg);
    inset: 4px;
  }

  nav {
    display: flex;
    gap: 0.25rem;
    margin-top: 0.75rem;
  }
  nav a {
    color: var(--fg);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 0.5rem 1rem;
    border: 1.5px solid transparent;
    transition: all 0.1s;
  }
  nav a:hover { border-color: var(--fg); }
  nav a.active { background: var(--fg); color: var(--bg); }

  /* demo content */
  .demo-content { padding-left: 1.5rem; border-left: 2px solid var(--rule); color: var(--muted); max-width: 55ch; }
  .section-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; }
  .marker { width: 12px; height: 12px; background: var(--accent); flex-shrink: 0; }
  .section-header h2 { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; }
  .switcher { position: fixed; top: 1rem; right: 1rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; padding: 0.4rem 0.8rem; background: var(--fg); color: var(--bg); border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 0.1em; }
</style>
</head>
<body>
<button class="switcher" onclick="document.documentElement.toggleAttribute('data-theme')||document.documentElement.setAttribute('data-theme',document.documentElement.getAttribute('data-theme')?'':'dark')">Toggle dark</button>
<div class="site">
  <div class="label">Option A — Accent Stripe</div>

  <header class="site-header">
    <div class="accent-stripe"></div>
    <div class="name-row">
      <a href="#" class="site-name">Cody Loyd</a>
      <button class="theme-toggle" aria-label="Toggle dark mode"></button>
    </div>
    <nav>
      <a href="#" class="active">About</a>
      <a href="#">Fiction</a>
      <a href="#">Games</a>
      <a href="#">Music</a>
    </nav>
  </header>

  <main>
    <div class="section-header"><div class="marker"></div><h2>Writing</h2></div>
    <div class="demo-content">
      <p>A bold accent-blue stripe sits above the header, giving the top of the page a strong color anchor without disrupting the typographic hierarchy. The stripe echoes the blue square section markers used throughout.</p>
    </div>
  </main>
</div>
<script>
  document.querySelector('.switcher').addEventListener('click', () => {
    const h = document.documentElement;
    h.getAttribute('data-theme') === 'dark' ? h.removeAttribute('data-theme') : h.setAttribute('data-theme', 'dark');
  });
  document.querySelector('.theme-toggle').addEventListener('click', () => {
    const h = document.documentElement;
    h.getAttribute('data-theme') === 'dark' ? h.removeAttribute('data-theme') : h.setAttribute('data-theme', 'dark');
  });
</script>
</body>
</html>
